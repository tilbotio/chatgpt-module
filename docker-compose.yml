name: tilbot
services:
  yarn-install:
    extends:
      file: ../../docker-compose.yml
      service: yarn-install

  frontend:
    extends:
      file: ../../docker-compose.yml
      service: frontend

  backend:
    extends:
      file: ../../docker-compose.yml
      service: backend
    networks:
      tbnetwork:
      default:

  mongo:
    extends:
      file: ../../docker-compose.yml
      service: mongo

  chatgpt:
    build:
      context: .
      args:
        PORT: ${PORT}
    restart: unless-stopped
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL}
      PORT: ${PORT}
    networks:
      tbnetwork:
    volumes:
      - .:/app

networks:
  tbnetwork:
    driver: bridge
    ipam:
      config:
        - subnet: 172.99.0.0/16
      driver: default

volumes:
  mongodb: