name: tilbot
services:
  chatgpt:
    build:
      context: .
      args:
        PORT: ${PORT}
    restart: unless-stopped
    environment:
      OPENAI_API_KEY_FILE: /run/secrets/chatgpt_default_openai_api_key
      OPENAI_API_KEY_FILES: ${OPENAI_API_KEY_FILES:-}
      OPENAI_MODEL: ${OPENAI_MODEL}
      PORT: ${PORT}
    secrets:
      - chatgpt_default_openai_api_key
    networks:
      tbpluginnetwork:

networks:
  tbpluginnetwork:
    driver: bridge
    ipam:
      driver: default

secrets:
  chatgpt_default_openai_api_key:
    file: ${CHATGPT_DEFAULT_OPENAI_API_KEY_FILE:-../../secrets/chatgpt_default_openai_api_key}
